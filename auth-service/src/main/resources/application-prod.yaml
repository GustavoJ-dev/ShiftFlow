spring:
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format-sql: false

logging:
  level:
    root: INFO
    org.gestaoescalas.auth: INFO
    org.hibernate.sql: OFF
    org.hibernate.orm.jdbc.bind: OFF
