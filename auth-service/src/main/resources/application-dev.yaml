spring:
  datasource:
    url: jdbc:mysql://localhost:3307/auth_db
    username: auth_user
    password: ${MYSQL_AUTH_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE