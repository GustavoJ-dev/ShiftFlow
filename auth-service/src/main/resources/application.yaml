spring:
  application:
    name: auth-service
  output:
    ansi:
      enabled: ALWAYS

  profiles:
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: true

server:
  port: 8081

logging:
  level:
    root: INFO
    com.gestaoescalas.auth: INFO
