spring:
  application:
    name: auth-service

  profiles:
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: true

server: 8081

logging:
  level:
    root: INFO
    com.gestaoescalas.auth: INFO
