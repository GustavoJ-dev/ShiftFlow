spring:
  application:
    name: schedule-service

  profiles:
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: true

server:
  port: 8082

app:
  services:
    auth:
      base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

logging:
  level:
    root: INFO
    com.gestaoescalas.schedule: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true