spring:
  application:
    name: schedule-service

  profiles:
    default: dev

  jpa:
    open-in-view:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: true

server:
  port: 8082

logging:
  level:
    root: INFO
    com.gestaoescalas.schedule: INFO

management:
  endpoints:
    web:
      exposure: health,info
  endpoint:
    health:
      probes:
        enabled: true