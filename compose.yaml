
services:
  mysql-auth:
    image: ${MYSQL_IMAGE:-mysql:8.4.13}
    container_name: shiftflow-mysql-auth
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_AUTH_ROOT_PASSWORD:?Defina MYSQL_AUTH_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: ${MYSQL_AUTH_PASSWORD:?Defina MYSQL_AUTH_PASSWORD no .env}
    ports:
      - "${MYSQL_AUTH_PORT:-3307}:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  mysql-schedule:
    image: ${MYSQL_IMAGE:-mysql:8.4.13}
    container_name: shiftflow-mysql-schedule
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_SCHEDULE_ROOT_PASSWORD:?Defina MYSQL_SCHEDULE_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: schedule_db
      MYSQL_USER: schedule_user
      MYSQL_PASSWORD: ${MYSQL_SCHEDULE_PASSWORD:?Defina MYSQL_SCHEDULE_PASSWORD no .env}
    ports:
      - "${MYSQL_SCHEDULE_PORT:-3308}:3306"
    volumes:
      - mysql_schedule_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management}
    container_name: shiftflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Defina RABBITMQ_USER no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_auth_data:
  mysql_schedule_data:
  rabbitmq_data:
