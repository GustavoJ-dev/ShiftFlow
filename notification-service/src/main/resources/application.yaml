spring:
  application:
    name: notification-service
  profiles:
    default: dev

server:
  port: 8083

app:
  messaging:
    queue: shift.events

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.gestaoescalas.notification: INFO